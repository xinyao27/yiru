name: APNs Gateway

on:
  pull_request:
    paths:
      - 'apps/apns-gateway/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/apns-gateway.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/apns-gateway/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/apns-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated bindings and Worker bundle
        run: |
          pnpm exec vp run @yiru/apns-gateway#types:generate
          git diff --exit-code -- apps/apns-gateway/worker-configuration.d.ts
          pnpm exec vp run @yiru/apns-gateway#lint
          pnpm exec vp run @yiru/apns-gateway#typecheck
          pnpm exec vp run @yiru/apns-gateway#build

  deploy:
    if: github.event_name != 'pull_request' && vars.APNS_GATEWAY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy stateless gateway
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_SHARED_SECRET: ${{ secrets.GATEWAY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in APNS_KEY_ID APNS_KEY_P8 APNS_TEAM_ID CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN GATEWAY_SHARED_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing APNs deployment credentials: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          secrets_file="$RUNNER_TEMP/yiru-apns-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          umask 077
          jq -n '{
            APNS_KEY_ID: env.APNS_KEY_ID,
            APNS_KEY_P8: env.APNS_KEY_P8,
            APNS_TEAM_ID: env.APNS_TEAM_ID,
            GATEWAY_SHARED_SECRET: env.GATEWAY_SHARED_SECRET
          }' > "$secrets_file"
          pnpm exec vp run @yiru/apns-gateway#typecheck
          pnpm --dir apps/apns-gateway exec wrangler deploy --secrets-file "$secrets_file"
