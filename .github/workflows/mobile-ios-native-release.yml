name: Mobile iOS Native Release

# Why: keep the native TestFlight lane independently verifiable while Expo
# remains the production rollback path until every cutover gate is closed.
on:
  push:
    tags:
      - 'mobile-ios-native-v*'
  workflow_dispatch:
    inputs:
      bump_patch_version:
        description: 'Bump the native iOS marketing version patch number before release.'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Optional exact native iOS marketing version, e.g. 0.1.0'
        required: false
        type: string
      testflight_distribution:
        description: 'TestFlight audience.'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
      testflight_changelog:
        description: 'Optional external TestFlight tester changelog.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-native-release
  cancel-in-progress: false

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile-ios

      # Why: App Store Connect can issue profiles but cannot recreate the
      # distribution private key, so import the runner-only certificate.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/yiru-native-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/yiru-native-release-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build and upload native app to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_IOS_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_IOS_BUMP_PATCH_VERSION: ${{ github.event.inputs.bump_patch_version }}
          TESTFLIGHT_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.testflight_distribution || 'internal' }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios release

      - name: Upload native .ipa artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yiru-mobile-ios-native-${{ github.run_number }}
          path: apps/mobile-ios/build/*.ipa
          if-no-files-found: ignore
