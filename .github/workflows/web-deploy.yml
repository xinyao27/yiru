name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      # Why: the product entry bundles both packages from workspace source, so
      # either package changing must publish a fresh web bundle.
      - 'packages/client/**'
      - 'packages/shared/**'
      # Why: the landing page renders product URLs straight out of the shared
      # workbench model, so a link change there must reach production too.
      - 'packages/workbench-model/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-deploy.yml'
  # Why: a redeploy must be possible without an empty commit — rollbacks and
  # Cloudflare-side incidents do not come with a source change.
  workflow_dispatch:

# Why: two overlapping deploys race to publish the same Worker, and the loser
# can land last. Serialize them and let the newer commit win.
concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Why: `version-file` reads vite-plus out of the workspace catalog, so CI
      # runs the same Vite+ the repository pins instead of drifting to latest.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Why: yiru-web imports @yiru/workbench-model from workspace source,
      # which only resolves once that package has emitted its build output. Both
      # tasks declare that through `dependsOn`, so the build order is no longer a
      # step this workflow has to remember.
      - name: Typecheck
        run: vp run yiru-web#typecheck

      - name: Deploy to Cloudflare Workers
        # Why: the target account is pinned in apps/web/wrangler.jsonc, so CI
        # only needs the credential — one source of truth for where this lands.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp run yiru-web#deploy
