name: Mobile iOS Native Archive

# Why: the Expo release remains the rollback path until every cutover gate passes; this manual
# workflow proves the native app and widget can be signed and exported without publishing them.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional native archive marketing version, e.g. 0.1.0'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-native-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile-ios

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile-ios

      # Why: App Store Connect can issue profiles but cannot recreate the distribution private key.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/yiru-native-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/yiru-native-dist-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build signed archive without upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_IOS_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          NATIVE_ARCHIVE_BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios archive

      - name: Upload signed archive evidence
        uses: actions/upload-artifact@v7
        with:
          name: yiru-mobile-native-signed-${{ github.run_number }}
          path: |
            apps/mobile-ios/build/Yiru.xcarchive
            apps/mobile-ios/build/Yiru.ipa
          if-no-files-found: error
          retention-days: 7
