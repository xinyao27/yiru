catalogMode: strict
catalogs:
  desktop:
    '@types/react': ^19.2.18
    '@xterm/addon-unicode11': 0.10.0-beta.287
    '@xterm/addon-webgl': 0.20.0-beta.286
    '@xterm/xterm': 6.1.0-beta.287
    react: ^19.2.8
    react-dom: ^19.2.8
    typescript: ^7.0.2
    ws: ^8.21.3
    zustand: ^5.0.15
  overrides:
    dompurify: 3.4.11
cleanupUnusedCatalogs: false
# Why: internal package versions also come through catalogs; matching workspace
# packages must still resolve to local source instead of the registry.
linkWorkspacePackages: true
# Why: @legendapp/list exposes an optional React Native peer, but this workspace uses only its
# browser entry point and the retired mobile stack must not return through dependency resolution.
ignoredOptionalDependencies:
  - react-native
# Why: pnpm 11 requires an explicit decision for every dependency install
# script; only packages that produce required native/runtime artifacts run.
allowBuilds:
  '@parcel/watcher': true
  agent-browser: true
  electron-winstaller: true
  esbuild: true
  msw: false
  node-pty: true
  sherpa-onnx: true
  workerd: true
overrides:
  vite: 'catalog:'
patchedDependencies:
  '@pierre/diffs@1.3.5': apps/desktop/config/patches/@pierre__diffs@1.3.5.patch
  '@xterm/addon-ligatures@0.11.0-beta.287': apps/desktop/config/patches/@xterm__addon-ligatures@0.11.0-beta.287.patch
  '@xterm/addon-serialize@0.15.0-beta.287': apps/desktop/config/patches/@xterm__addon-serialize@0.15.0-beta.287.patch
  '@xterm/addon-webgl@0.20.0-beta.286': apps/desktop/config/patches/@xterm__addon-webgl@0.20.0-beta.286.patch
  node-pty@1.1.0: apps/desktop/config/patches/node-pty@1.1.0.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux
    - win32
# Why: this explicitly requested package is exact-pinned while it is newer than the supply-chain age gate.
minimumReleaseAgeExclude:
  - thinking-orbs@0.1.1
  - '@pierre/diffs@1.3.5'
  - '@tanstack/history@1.162.1'
  - '@tanstack/react-router@1.170.21'
  - '@tanstack/router-core@1.171.18'
